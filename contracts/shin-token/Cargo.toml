[package]
name = "shin-token-contract"
version = "0.1.0"
edition = "2021"
authors = ["28 Dreams Studio"]
description = "SHIN ($SHIN) NEP-141 Fungible Token for SHIN: The Struggle on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", features = ["legacy"] }
borsh = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
